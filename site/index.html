<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantee Videos</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  nav { overflow-y: auto; border-right: 1px solid #8884; }
  nav a { display: block; padding: 12px 16px; color: inherit; text-decoration: none; border-bottom: 1px solid #8882; }
  nav a.active { background: #8883; }
  nav summary { padding: 10px 16px; font-weight: 600; cursor: pointer; background: #8881; border-bottom: 1px solid #8882; }
  nav details a { padding-left: 32px; }
  nav small, .meta { opacity: .7; }
  nav select, nav input { box-sizing: border-box; width: calc(100% - 24px); margin: 12px 12px 0; padding: 6px; font: inherit; }
  #list { margin-top: 12px; }
  main { overflow-y: auto; padding: 24px; }
  video { width: 100%; max-height: 70vh; background: #000; }
  pre { white-space: pre-wrap; font: inherit; background: #8881; padding: 12px; border-radius: 6px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; margin-right: 4px; color: #fff; }
  .draft { background: #888; } .ready { background: #21c45d; } .fix { background: #ef4343; } .published { background: #7b61ff; }
  table.pub { border-collapse: collapse; width: 100%; }
  table.pub td { border-top: 1px solid #8883; padding: 8px; vertical-align: top; }
  table.pub td:first-child { width: 120px; opacity: .7; } table.pub td:last-child { width: 60px; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; height: auto; } nav { max-height: 40vh; } main { padding: 16px; } }
</style>
</head>
<body>
<nav><input id="q" type="search" placeholder="Search videos…" oninput="render()" aria-label="Search videos"><select id="filter" onchange="render()" aria-label="Filter by status"></select><select id="sort" onchange="render()" aria-label="Group videos"><option value="challenge">By challenge #</option><option value="bank">By quiz bank</option></select><div id="list"></div></nav>
<main id="detail"></main>
<script>
function el(tag, props, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}

// Status comes from meta.json: posts -> published, else "status" (draft by default, set by the buttons below).
const LABELS = { draft: 'Draft', ready: 'Ready to publish', fix: 'Fix required' };
function status(v) {
  if (v.posts?.length) return ['published', 'Published: ' + v.posts.map(p => p.platform).join(', ')];
  const s = LABELS[v.status] ? v.status : 'draft';
  return [s, LABELS[s]];
}
async function setStatus(v, status) {
  let fixes;
  if (status === 'fix') {
    const note = prompt('What needs fixing? (one item per line is fine)', (v.fixes || []).join('\n'));
    if (note === null) return;
    fixes = note.split('\n').map(s => s.trim()).filter(Boolean);
  }
  const r = await fetch('/api/status', { method: 'POST', body: JSON.stringify({ slug: v.slug, status, fixes }) });
  if (!r.ok) return alert('Could not save status');
  Object.assign(v, { status, fixes });
  render();
}
// What "Republish short" does, shown before it runs (YouTube can't swap the file of an uploaded video).
const REPUBLISH = v => `Republish the short "${v.short?.title}" to YouTube?

What happens:
• The current short.mp4 is uploaded as a NEW short, with its current title, description and challenge number.
• The old short (${v.short?.youtube_id}) is set to PRIVATE: hidden from viewers, kept on the channel (not deleted), so you can undo it in YouTube Studio.
• Views, likes and comments of the old short do NOT carry over: the new one starts from zero.
• The old link stops working for viewers; meta.json gets the new link (the old one is kept under short.replaced).
• Afterwards, set the new short's Related video to the full lesson in YouTube Studio again (the API can't).`;
// kind: video | short | both | republish. The short goes up after the video, so its description can link to it.
async function uploadYouTube(v, btn, kind, site = 'youtube') {
  const what = { video: `"${v.title}"`, short: `the short "${v.short?.title}"`, both: `"${v.title}" and its short` }[kind];
  const name = { youtube: 'YouTube', tiktok: 'TikTok' }[site];
  let at = null;  // null = publish now; a Date = YouTube publishes the private upload then
  if (kind === 'republish' || site !== 'youtube') {
    if (!confirm(kind === 'republish' ? REPUBLISH(v) : `Upload ${what} to ${name}?`)) return;
  } else {
    at = await askWhen(`Publish ${what} to YouTube`);
    if (at === undefined) return;
  }
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Uploading…';
  const r = await fetch('/api/' + site, { method: 'POST', body: JSON.stringify({ slug: v.slug, kind, ...(at && { publish_at: at.toISOString() }) }) });
  const d = await r.json().catch(() => ({ error: 'bad response' }));
  videos = await fetch('/api/videos').then(r => r.json());  // meta.json may have changed even on failure ("both")
  render();
  if (!r.ok) { btn.disabled = false; btn.textContent = label; alert(name + ' upload failed: ' + d.error); }
  else if (at && !d.scheduled) alert('The server ignored the schedule and published NOW (restart ./start.sh to load the new code). Set it private in YouTube Studio if needed.');
  else if (d.warning) alert(d.warning);
}
// Publish dialog: now, or at a local date/time (sent as UTC; YouTube holds the upload private until then).
// Resolves null (now), a Date (scheduled) or undefined (cancelled).
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const fmt = d => d.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
function askWhen(title) {
  const pad = n => String(n).padStart(2, '0');
  const t = new Date(); t.setHours(18, 30, 0, 0);  // default: the next 6:30 PM local time
  if (t <= new Date()) t.setDate(t.getDate() + 1);
  const input = el('input', { type: 'datetime-local', value: `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}T18:30` });
  const note = el('p', { className: 'meta' });
  const show = () => { const d = new Date(input.value); note.textContent = input.value ? `Goes public ${fmt(d)}` + (d <= new Date() ? ' (in the past!)' : '') : ''; };
  input.oninput = show; show();
  const dlg = el('dialog', {},
    el('h2', {}, title),
    el('p', {}, el('button', { onclick: () => done(null) }, 'Publish now')),
    el('p', {}, `Or schedule it (your local time, ${TZ}):`),
    el('p', {}, input, ' ', el('button', { onclick: () => {
      const d = new Date(input.value);
      if (!input.value || d <= new Date()) return alert('Pick a time in the future.');
      done(d);
    } }, 'Schedule')),
    note,
    el('p', { className: 'meta' }, 'Scheduled: uploads now as private, and YouTube makes it public at that time.'),
    el('p', {}, el('button', { onclick: () => done(undefined) }, 'Cancel')));
  let done;
  const p = new Promise(r => { done = x => { dlg.close(); dlg.remove(); r(x); }; });
  dlg.oncancel = () => done(undefined);  // Esc
  document.body.append(dlg); dlg.showModal();
  return p;
}
async function markPosted(v, api, ask, err) {
  const url = prompt(ask);
  if (!url) return;
  const r = await fetch('/api/' + api, { method: 'POST', body: JSON.stringify({ slug: v.slug, url: url.trim() }) });
  if (!r.ok) return alert('Could not save: ' + err);
  videos = await fetch('/api/videos').then(r => r.json());
  render();
}
const badge = v => { const [c, t] = status(v); return el('span', { className: 'badge ' + c }, t); };

// Common publish fields. Tags come from the server (tools/youtube.py tags()).
function publishFields(v) {
  const tags = v.publish_tags || [];
  const hook = (v.description || '').split('\n')[0];
  const xpost = `${v.title}\n\n${hook}`;
  return [
    ['Title', v.title || ''], ['Description', v.publish_description || v.description || ''], ['Tags', tags.join(', ')],
    ['Hashtags', tags.slice(0, 3).map(t => '#' + t.replace(/\W/g, '')).join(' ')],
    ['X post', xpost.length > 280 ? xpost.slice(0, 279) + '…' : xpost],
    ['Category', 'Education'], ['Language', 'English'],
    ['Thumbnail', v.poster ? location.origin + v.poster : '(no poster.jpg)'],
    ...(v.tiktok_caption ? [['TikTok caption', v.tiktok_caption]] : []),
    ...(v.youtube_quiz ? [['YouTube quiz post', v.youtube_quiz]] : []),
  ];
}

// China cut (Xiaohongshu / WeChat Channels): *-cn.mp4 (no domain on screen) + meta.json "cn" text (no links). Posted by hand.
function cnSection(v) {
  const c = v.cn || {};
  const rows = [['Video title', c.video?.title], ['Video description', c.video?.description],
    ['Short title', c.short?.title], ['Short description', c.short?.description]].filter(([, t]) => t);
  return [el('h2', {}, 'China cut (Xiaohongshu / WeChat Channels)'),
    el('p', {}, 'Post by hand and tick the "AI-generated content" declaration (内容由AI生成).'),
    ...(v.video_cn ? [el('video', { src: v.video_cn, controls: true })] : [el('p', {}, 'video-cn.mp4 not rendered')]),
    ...(v.short_video_cn ? [el('video', { src: v.short_video_cn, controls: true, style: 'width: auto; height: 70vh' })] : []),
    el('table', { className: 'pub' }, ...rows.map(([k, val]) => el('tr', {},
      el('td', {}, k), el('td', { style: 'white-space: pre-line' }, val),
      el('td', {}, el('button', { onclick: e => copy(val, e.target) }, 'Copy')))))];
}

// navigator.clipboard needs https or localhost; over plain-http LAN fall back to execCommand.
function copy(text, btn) {
  const done = () => btn.textContent = 'Copied';
  if (navigator.clipboard) return navigator.clipboard.writeText(text).then(done);
  const t = el('textarea', { value: text });
  document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); done();
}

let videos = [];
const closed = new Set();  // folders the user collapsed, kept across re-renders

function render() {
  const slug = decodeURIComponent(location.hash.slice(1)) || videos[0]?.slug;
  // Status filter, with counts; the selection survives re-renders.
  const want = filter.value || 'all';
  const counts = Object.groupBy(videos, v => status(v)[0]);
  filter.replaceChildren(...Object.entries({ all: 'All', ...LABELS, published: 'Published' }).map(([k, t]) =>
    el('option', { value: k, selected: k === want }, `${t} (${k === 'all' ? videos.length : counts[k]?.length || 0})`)));
  // Search: every word must appear in the title, slug, question id or description.
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = (want === 'all' ? videos : counts[want] || []).filter(v => {
    const text = [v.title, v.slug, v.question_id, v.description].join(' ').toLowerCase();
    return words.every(w => text.includes(w));
  });
  // One folder per quiz bank (question_id = "<bank>:<id>"), or per short series in challenge order (the publish order).
  const bySeries = sort.value === 'challenge';
  // ponytail: a "-zh" slug is the Chinese series; store a series field in meta.json if more languages come
  const series = v => !v.short?.challenge ? 'No short' : `${v.short.tags?.[0] || 'Other'}${v.slug.endsWith('-zh') ? ' Chinese' : ''} challenges`;
  const banks = Map.groupBy(bySeries ? [...shown].sort((a, b) => (a.short?.challenge ?? 1e9) - (b.short?.challenge ?? 1e9)) : shown,
    v => bySeries ? series(v) : v.question_id?.split(':')[0] || 'Other');
  list.replaceChildren(...[...banks].sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true })).map(([bank, vs]) =>
    el('details', { open: words.length > 0 || !closed.has(bank), ontoggle: e => closed[e.target.open ? 'delete' : 'add'](bank) },
      el('summary', { title: bank }, `${bank.replace(/^amc_practice_|_template$/g, '')} (${vs.length})`),
      ...vs.map(v => el('a',
        { href: '#' + encodeURIComponent(v.slug), className: v.slug === slug ? 'active' : '' },
        bySeries && v.short?.challenge ? `#${v.short.challenge} ` : '', v.title || v.slug, el('br'), badge(v),
        el('small', {}, [v.question_id?.split(':')[1], v.created].filter(Boolean).join(' · ')))))));

  if (!shown.length) list.replaceChildren(el('p', { style: 'padding: 0 16px' }, 'No matching videos.'));
  const v = videos.find(v => v.slug === slug);
  if (!v) return detail.replaceChildren(el('p', {}, 'No videos yet. Add a folder under videos/ with a meta.json.'));
  detail.replaceChildren(
    v.video ? el('video', { src: v.video, controls: true, ...(v.poster && { poster: v.poster }) })
            : el('p', {}, 'video.mp4 not found'),
    ...(v.short_video ? [el('h2', {}, 'Short' + (v.short?.title ? `: ${v.short.title}` : '')),
      el('video', { src: v.short_video, controls: true, style: 'width: auto; height: 70vh' })] : []),
    el('h1', {}, v.title || v.slug),
    el('p', { className: 'meta' }, `Created ${v.created || '—'} · ${v.slug}${v.question_id ? ` · Question ${v.question_id}` : ''}`),
    el('p', {}, badge(v), ...(v.posts?.length ? [] : Object.entries({
        ready: 'Mark ready to publish', fix: 'Needs fix', draft: 'Back to draft' })
      .filter(([k]) => k !== status(v)[0])
      .map(([k, label]) => el('button', { onclick: () => setStatus(v, k), style: 'margin-left: 8px' }, label))),
      ...[['video', 'Publish to YouTube', !v.youtube_id && v.video],
          ['both', 'Publish video + short', !v.youtube_id && v.video && v.short_video && v.short],
          ['short', 'Publish short', v.youtube_id && v.short_video && v.short && !v.short.youtube_id],
          ['republish', 'Republish short', v.short_video && v.short?.youtube_id],
          ]
        .filter(([, , show]) => show)
        .map(([kind, label, , site]) => el('button', { onclick: e => uploadYouTube(v, e.target, kind, site), style: 'margin-left: 8px' }, label)),
      // ponytail: TikTok's API only posts privately until the app is audited, so shorts go up by hand and get marked here
      ...(v.short_video && v.short && !v.short.posts?.some(p => p.platform === 'TikTok')
        ? [el('button', { onclick: () => markPosted(v, 'tiktok-posted', `TikTok link of the short "${v.short.title}" (Share → Copy link):`,
            'the link must start with https://www.tiktok.com/ or https://vm.tiktok.com/'), style: 'margin-left: 8px' }, 'Mark short on TikTok')] : []),
      // ponytail: the YouTube API can't create Posts, so the quiz post (copy row below) goes up by hand and gets marked here
      ...(v.youtube_id && v.youtube_quiz && !v.posts?.some(p => p.platform === 'YouTube quiz post')
        ? [el('button', { onclick: () => markPosted(v, 'quiz-posted', 'Link of the YouTube quiz post (⋮ → Copy link):',
            'the link must start with https://www.youtube.com/'), style: 'margin-left: 8px' }, 'Mark quiz posted')] : [])),
    ...(v.fixes?.length ? [el('ul', {}, ...v.fixes.map(f => el('li', {}, f)))] : []),
    ...(v.posts?.length ? [el('h2', {}, 'Published'), el('ul', {}, ...[...v.posts, ...(v.short?.posts || [])].map(p =>
      el('li', {}, el('a', { href: p.url, target: '_blank', rel: 'noopener' }, p.platform || p.url),
        p.published_at ? (p.scheduled_at && new Date(p.published_at) > new Date() ? ' · goes public ' : ' · ') + fmt(new Date(p.published_at)) : '',
        p.scheduled_at ? ` (scheduled ${fmt(new Date(p.scheduled_at))})` : '')))] : []),
    el('h2', {}, 'Publish metadata'),
    el('table', { className: 'pub' }, ...publishFields(v).map(([k, val]) => el('tr', {},
      el('td', {}, k), el('td', { style: 'white-space: pre-line' }, val),
      el('td', {}, el('button', { onclick: e => copy(val, e.target) }, 'Copy'))))),
    ...(v.video_cn || v.short_video_cn || v.cn ? cnSection(v) : []),
    el('h2', {}, 'Script'),
    el('pre', {}, v.script || '(no script.md)'));
}

addEventListener('hashchange', render);
fetch('/api/videos').then(r => r.json()).then(d => { videos = d; render(); });
</script>
</body>
</html>
