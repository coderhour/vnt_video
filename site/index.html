<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantee Videos</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  nav { overflow-y: auto; border-right: 1px solid #8884; }
  nav a { display: block; padding: 12px 16px; color: inherit; text-decoration: none; border-bottom: 1px solid #8882; }
  nav a.active { background: #8883; }
  nav summary { padding: 10px 16px; font-weight: 600; cursor: pointer; background: #8881; border-bottom: 1px solid #8882; }
  nav details a { padding-left: 32px; }
  nav small, .meta { opacity: .7; }
  nav select, nav input { box-sizing: border-box; width: calc(100% - 24px); margin: 12px 12px 0; padding: 6px; font: inherit; }
  #list { margin-top: 12px; }
  main { overflow-y: auto; padding: 24px; }
  video { width: 100%; max-height: 70vh; background: #000; }
  pre { white-space: pre-wrap; font: inherit; background: #8881; padding: 12px; border-radius: 6px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; margin-right: 4px; color: #fff; }
  .draft { background: #888; } .ready { background: #21c45d; } .fix { background: #ef4343; } .published { background: #7b61ff; }
  table.pub { border-collapse: collapse; width: 100%; }
  table.pub td { border-top: 1px solid #8883; padding: 8px; vertical-align: top; }
  table.pub td:first-child { width: 120px; opacity: .7; } table.pub td:last-child { width: 60px; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; height: auto; } nav { max-height: 40vh; } main { padding: 16px; } }
</style>
</head>
<body>
<nav><input id="q" type="search" placeholder="Search videos…" oninput="render()" aria-label="Search videos"><select id="filter" onchange="render()" aria-label="Filter by status"></select><div id="list"></div></nav>
<main id="detail"></main>
<script>
function el(tag, props, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}

// Status comes from meta.json: posts -> published, else "status" (draft by default, set by the buttons below).
const LABELS = { draft: 'Draft', ready: 'Ready to publish', fix: 'Fix required' };
function status(v) {
  if (v.posts?.length) return ['published', 'Published: ' + v.posts.map(p => p.platform).join(', ')];
  const s = LABELS[v.status] ? v.status : 'draft';
  return [s, LABELS[s]];
}
async function setStatus(v, status) {
  let fixes;
  if (status === 'fix') {
    const note = prompt('What needs fixing? (one item per line is fine)', (v.fixes || []).join('\n'));
    if (note === null) return;
    fixes = note.split('\n').map(s => s.trim()).filter(Boolean);
  }
  const r = await fetch('/api/status', { method: 'POST', body: JSON.stringify({ slug: v.slug, status, fixes }) });
  if (!r.ok) return alert('Could not save status');
  Object.assign(v, { status, fixes });
  render();
}
async function uploadYouTube(v, btn) {
  if (!confirm(`Upload "${v.title}" to YouTube?`)) return;
  btn.disabled = true; btn.textContent = 'Uploading…';
  const r = await fetch('/api/youtube', { method: 'POST', body: JSON.stringify({ slug: v.slug }) });
  const d = await r.json().catch(() => ({ error: 'bad response' }));
  if (!r.ok) { btn.disabled = false; btn.textContent = 'Publish to YouTube'; return alert('YouTube upload failed: ' + d.error); }
  v.youtube_id = d.id;
  v.posts = [...(v.posts || []), { platform: 'YouTube', url: 'https://www.youtube.com/watch?v=' + d.id }];
  render();
}
const badge = v => { const [c, t] = status(v); return el('span', { className: 'badge ' + c }, t); };

// Common publish fields. Tags come from the server (tools/youtube.py tags()).
function publishFields(v) {
  const tags = v.publish_tags || [];
  const hook = (v.description || '').split('\n')[0];
  const xpost = `${v.title}\n\n${hook}`;
  return [
    ['Title', v.title || ''], ['Description', v.description || ''], ['Tags', tags.join(', ')],
    ['Hashtags', tags.slice(0, 3).map(t => '#' + t.replace(/\W/g, '')).join(' ')],
    ['X post', xpost.length > 280 ? xpost.slice(0, 279) + '…' : xpost],
    ['Category', 'Education'], ['Language', 'English'],
    ['Thumbnail', v.poster ? location.origin + v.poster : '(no poster.jpg)'],
  ];
}

// navigator.clipboard needs https or localhost; over plain-http LAN fall back to execCommand.
function copy(text, btn) {
  const done = () => btn.textContent = 'Copied';
  if (navigator.clipboard) return navigator.clipboard.writeText(text).then(done);
  const t = el('textarea', { value: text });
  document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); done();
}

let videos = [];
const closed = new Set();  // folders the user collapsed, kept across re-renders

function render() {
  const slug = decodeURIComponent(location.hash.slice(1)) || videos[0]?.slug;
  // Status filter, with counts; the selection survives re-renders.
  const want = filter.value || 'all';
  const counts = Object.groupBy(videos, v => status(v)[0]);
  filter.replaceChildren(...Object.entries({ all: 'All', ...LABELS, published: 'Published' }).map(([k, t]) =>
    el('option', { value: k, selected: k === want }, `${t} (${k === 'all' ? videos.length : counts[k]?.length || 0})`)));
  // Search: every word must appear in the title, slug, question id or description.
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const shown = (want === 'all' ? videos : counts[want] || []).filter(v => {
    const text = [v.title, v.slug, v.question_id, v.description].join(' ').toLowerCase();
    return words.every(w => text.includes(w));
  });
  // One folder per quiz bank (question_id = "<bank>:<id>"), videos inside.
  const banks = Map.groupBy(shown, v => v.question_id?.split(':')[0] || 'Other');
  list.replaceChildren(...[...banks].sort(([a], [b]) => a.localeCompare(b)).map(([bank, vs]) =>
    el('details', { open: words.length > 0 || !closed.has(bank), ontoggle: e => closed[e.target.open ? 'delete' : 'add'](bank) },
      el('summary', { title: bank }, `${bank.replace(/^amc_practice_|_template$/g, '')} (${vs.length})`),
      ...vs.map(v => el('a',
        { href: '#' + encodeURIComponent(v.slug), className: v.slug === slug ? 'active' : '' },
        v.title || v.slug, el('br'), badge(v),
        el('small', {}, [v.question_id?.split(':')[1], v.created].filter(Boolean).join(' · ')))))));

  if (!shown.length) list.replaceChildren(el('p', { style: 'padding: 0 16px' }, 'No matching videos.'));
  const v = videos.find(v => v.slug === slug);
  if (!v) return detail.replaceChildren(el('p', {}, 'No videos yet. Add a folder under videos/ with a meta.json.'));
  detail.replaceChildren(
    v.video ? el('video', { src: v.video, controls: true, ...(v.poster && { poster: v.poster }) })
            : el('p', {}, 'video.mp4 not found'),
    el('h1', {}, v.title || v.slug),
    el('p', { className: 'meta' }, `Created ${v.created || '—'} · ${v.slug}${v.question_id ? ` · Question ${v.question_id}` : ''}`),
    el('p', {}, badge(v), ...(v.posts?.length ? [] : Object.entries({
        ready: 'Mark ready to publish', fix: 'Needs fix', draft: 'Back to draft' })
      .filter(([k]) => k !== status(v)[0])
      .map(([k, label]) => el('button', { onclick: () => setStatus(v, k), style: 'margin-left: 8px' }, label))),
      ...(v.youtube_id || !v.video ? [] : [el('button', { onclick: e => uploadYouTube(v, e.target), style: 'margin-left: 8px' }, 'Publish to YouTube')])),
    ...(v.fixes?.length ? [el('ul', {}, ...v.fixes.map(f => el('li', {}, f)))] : []),
    ...(v.posts?.length ? [el('h2', {}, 'Published'), el('ul', {}, ...v.posts.map(p =>
      el('li', {}, el('a', { href: p.url, target: '_blank', rel: 'noopener' }, p.platform || p.url))))] : []),
    el('h2', {}, 'Publish metadata'),
    el('table', { className: 'pub' }, ...publishFields(v).map(([k, val]) => el('tr', {},
      el('td', {}, k), el('td', { style: 'white-space: pre-line' }, val),
      el('td', {}, el('button', { onclick: e => copy(val, e.target) }, 'Copy'))))),
    el('h2', {}, 'Script'),
    el('pre', {}, v.script || '(no script.md)'));
}

addEventListener('hashchange', render);
fetch('/api/videos').then(r => r.json()).then(d => { videos = d; render(); });
</script>
</body>
</html>
